[project]
name = "deepl"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
    "pillow>=10.2.0",
    "seaborn>=0.13.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
]

[project.scripts]
lab3-train = "Lab3.train_cli:main"
lab3-analyze = "Lab3.analyze_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Lab3"]
